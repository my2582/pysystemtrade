# Mechanism cheatsheet — tbm_meta_us10_tmax40
# Source: ars/evidence_packs/tbm_meta_us10_baseline/tbm_meta_us10_baseline_preregistration.md §5.1.1
# Single-variable T_max ablation of the baseline TBM cell. Hand-authored 2026-05-31.
applies_to: >
  SINGLE-VARIABLE SENSITIVITY of tbm_meta_us10_baseline_1m: vertical barrier
  T_max = 40 business days (vs 120). ALL other parameters identical. This is a
  DIAGNOSTIC, not an optimisation — headline output is g_max_observed and
  avg_uniqueness, NOT gate pass/fail.
core_formula:
  name: "Same TBM meta-sizer; vertical barrier shortened 120 bd -> 40 bd"
  latex: >
    \mathrm{PT}=8\hat{\sigma},\quad \mathrm{SL}=4\hat{\sigma},\quad
    T_{\max}=40\,\text{bd} \;\;(\text{was }120)
  vars: >
    Identical Martin §2.5 &sigma;&#770; (20d EMA-of-squared-absolute-change, &gamma;=0.95),
    PT=8&sigma; / SL=4&sigma; (σ-multipliers auto-track, NOT re-calibrated absolutes),
    single &tau;=0.50, single feature-subset = ER+rest, &kappa;=1.0&sigma;, g_min=0.30.
  note: >
    Shorter label window &rArr; less overlap &rArr; <b>higher average uniqueness</b>.
    Algebraic prediction: avg_uniqueness ~0.07 &rarr; ~0.21; effective sample
    ~290 &rarr; ~870 distinct training units.
triggering:
  rule: >
    Diagnostic tree on g_max_observed: &gt;0.75 = effective-sample collapse was the
    cause (Stage-1 HAS value, re-tune T_max); &lt;0.60 = no learnable conditional
    edge on ZN-post-2003 (Stage-1 at ceiling, pursue Stage-2 / multi-instrument);
    0.60-0.75 = partial, schedule T_max &isin; {60, 80}.
  scale_factor: >
    g(m_t) \in [0.30,\,1.0] \quad\text{(same scaler; discriminates collapse vs no-signal)}
  cells: >
    Single config internally (feat=ER_plus_rest, &tau;=0.50, T_max=40). Family
    accounting charges +8 to n_configs_searched (50 &rarr; 58) for the T_max axis
    as one further honest selection dimension.
action:
  trade_shape: "Identical to baseline TBM — continuous re-sizing of the Martin side, no new alpha."
  observation: "CUSUM event day (T)."
  trade: "Next bar (T+1)."
  between_rebals: "g(m_t) daily, floored 0.30 / capped 1.0."
  leverage_cap: "max(g_t) &le; 1.0; g_min=0.30."
  re_entry: "Not applicable — overlay scales an always-on side."
