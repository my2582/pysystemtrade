#YAML
# Trend-only configuration: Pure EWMAC at 6 speeds
# Usage: python scripts/backtest.py --config scripts/backtest_config/trend_only.yaml --instruments SP500_micro,CRUDE_W,GOLD,US10

trading_rules:
  ewmac2_8:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args:
      Lfast: 2
      Lslow: 8
    forecast_scalar: 10.6
  ewmac4_16:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
