forecast_cap: 20.0

forecast_weights:
  ewmac2_8: 0.167
  ewmac4_16: 0.167
  ewmac8_32: 0.167
  ewmac16_64: 0.167
  ewmac32_128: 0.167
  ewmac64_256: 0.167
forecast_div_multiplier: 1.4

percentage_vol_target: 20.0
notional_trading_capital: 250000
base_currency: "USD"
