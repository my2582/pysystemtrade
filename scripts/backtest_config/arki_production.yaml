#YAML
# ================================================================
# Arki Production Futures Strategy
# ================================================================
# Three-factor alpha: Trend (EWMAC) + Carry + Cross-Sectional Momentum
# All rules are pysystemtrade built-in modules.
#
# Capital: USD 200,000 | Vol Target: 25% | 16 instruments
# Position sizing: dynamic_small_system_optimise (integer contracts)
#
# Usage:
#   python scripts/backtest.py --system arki --report full
# ================================================================

# === INSTRUMENTS ===
instruments:
  # Equity (5)
  - SP500
  - NASDAQ_micro
  - DAX
  - NIKKEI
  - FTSE100
  # Bond (5)
  - US10
  - US5
  - BUND
  - GILT
  - JGB
  # Metals (3)
  - GOLD
  - SILVER
  - COPPER-micro
  # Energy (2)
  - CRUDE_W
  - BRENT-LAST
  # FX (1)
  - AUD_micro

# === TRADING RULES (11 rules, all pysystemtrade built-in) ===
trading_rules:
  # --- Time-Series Momentum (EWMAC × 5 speeds) ---
  momentum4:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args:
      Lfast: 4
      Lslow: 16
  momentum8:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args:
      Lfast: 8
      Lslow: 32
  momentum16:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args:
      Lfast: 16
      Lslow: 64
  momentum32:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args:
      Lfast: 32
      Lslow: 128
  momentum64:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args:
      Lfast: 64
      Lslow: 256

  # --- Carry (3 speeds) ---
  carry30:
    function: systems.provided.rules.carry.carry
    data:
      - "rawdata.raw_carry"
    other_args:
      smooth_days: 30
  carry60:
    function: systems.provided.rules.carry.carry
    data:
      - "rawdata.raw_carry"
    other_args:
      smooth_days: 60
  carry125:
    function: systems.provided.rules.carry.carry
    data:
      - "rawdata.raw_carry"
    other_args:
      smooth_days: 125

  # --- Cross-Sectional Momentum (3 horizons) ---
  relmomentum20:
    function: systems.provided.rules.rel_mom.relative_momentum
    data:
      - "rawdata.get_cumulative_daily_vol_normalised_returns"
      - "rawdata.normalised_price_for_asset_class"
    other_args:
      horizon: 20
  relmomentum40:
    function: systems.provided.rules.rel_mom.relative_momentum
    data:
      - "rawdata.get_cumulative_daily_vol_normalised_returns"
      - "rawdata.normalised_price_for_asset_class"
    other_args:
      horizon: 40
  relmomentum80:
    function: systems.provided.rules.rel_mom.relative_momentum
    data:
      - "rawdata.get_cumulative_daily_vol_normalised_returns"
      - "rawdata.normalised_price_for_asset_class"
    other_args:
      horizon: 80

# === FORECAST SCALARS (from Rob Carver's calibrated values) ===
forecast_scalars:
  momentum4: 8.54
  momentum8: 5.95
  momentum16: 4.10
  momentum32: 2.79
  momentum64: 1.91
  carry30: 28.38
  carry60: 28.40
  carry125: 29.37
  relmomentum20: 86.51
  relmomentum40: 117.78
  relmomentum80: 159.88

use_forecast_scale_estimates: False

# === FORECAST COMBINATION ===
# Equal-weighted within each factor, then 1/3 per factor group
#   Trend:  5 rules × (1/3 ÷ 5) = 0.0667 each
#   Carry:  3 rules × (1/3 ÷ 3) = 0.1111 each
#   CS Mom: 3 rules × (1/3 ÷ 3) = 0.1111 each
forecast_cap: 20.0
forecast_weights:
  momentum4: 0.0667
  momentum8: 0.0667
  momentum16: 0.0667
  momentum32: 0.0667
  momentum64: 0.0667
  carry30: 0.1111
  carry60: 0.1111
  carry125: 0.1111
  relmomentum20: 0.1111
  relmomentum40: 0.1111
  relmomentum80: 0.1111

use_forecast_weight_estimates: False

forecast_div_multiplier: 1.35

# === POSITION SIZING ===
percentage_vol_target: 25.0
notional_trading_capital: 200000
base_currency: "USD"

# === INSTRUMENT WEIGHTS ===
# Equal-weighted by asset class, then equal within class
# Equity 30%, Bond 30%, Metals 15%, Energy 15%, FX 10%
use_instrument_weight_estimates: False
instrument_weights:
  SP500: 0.060
  NASDAQ_micro: 0.060
  DAX: 0.060
  NIKKEI: 0.060
  FTSE100: 0.060
  US10: 0.060
  US5: 0.060
  BUND: 0.060
  GILT: 0.060
  JGB: 0.060
  GOLD: 0.050
  SILVER: 0.050
  COPPER-micro: 0.050
  CRUDE_W: 0.075
  BRENT-LAST: 0.075
  AUD_micro: 0.100

use_instrument_div_mult_estimates: True

# === VOLATILITY CALCULATION ===
volatility_calculation:
  func: "sysquant.estimators.vol.mixed_vol_calc"
  days: 35
  min_periods: 10
  vol_abs_min: 0.0000000001
  slow_vol_years: 20
  proportion_of_slow_vol: 0.35
  backfill: True

# === DYNAMIC SMALL SYSTEM (for integer position optimization) ===
small_system:
  shadow_cost: 10
  tracking_error_buffer: 0.12
  cost_multiplier: 1.0
  shrink_instrument_returns_correlation: 0.5

# === RISK OVERLAY ===
risk_overlay:
  max_risk_fraction_normal_risk: 2.0
  max_risk_fraction_stdev_risk: 4.0
  max_risk_limit_sum_abs_risk: 5.0
  max_risk_leverage: 15.0
