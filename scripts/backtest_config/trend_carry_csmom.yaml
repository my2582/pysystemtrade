#YAML
# Combined Strategy: Trend-Following + Carry + Cross-Sectional Momentum
# =====================================================================
# Three orthogonal alpha sources for diversified futures trading.
#
# Usage:
#   python scripts/backtest.py --config scripts/backtest_config/trend_carry_csmom.yaml --capital 200000 --report full
#   python scripts/backtest.py --config scripts/backtest_config/trend_carry_csmom.yaml --instruments SP500_micro,US10,GOLD_micro,EUR_micro,CORN --capital 200000

# === TRADING RULES ===

trading_rules:
  # --- Trend-Following (EWMAC) ---
  # Dual-moving-average crossover at 5 speeds, vol-normalised
  momentum4:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args:
      Lfast: 4
      Lslow: 16
  momentum8:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args:
      Lfast: 8
      Lslow: 32
  momentum16:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args:
      Lfast: 16
      Lslow: 64
  momentum32:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args:
      Lfast: 32
      Lslow: 128
  momentum64:
    function: systems.provided.rules.ewmac.ewmac
    data:
      - "rawdata.get_daily_prices"
      - "rawdata.daily_returns_volatility"
    other_args:
      Lfast: 64
      Lslow: 256

  # --- Carry ---
  # Smoothed annualized carry (rolldown) at multiple speeds
  carry30:
    function: systems.provided.rules.carry.carry
    data:
      - "rawdata.raw_carry"
    other_args:
      smooth_days: 30
  carry60:
    function: systems.provided.rules.carry.carry
    data:
      - "rawdata.raw_carry"
    other_args:
      smooth_days: 60
  carry125:
    function: systems.provided.rules.carry.carry
    data:
      - "rawdata.raw_carry"
    other_args:
      smooth_days: 125

  # --- Cross-Sectional Momentum ---
  # Relative outperformance vs asset-class peers, vol-normalised
  relmomentum20:
    function: systems.provided.rules.rel_mom.relative_momentum
    data:
      - "rawdata.get_cumulative_daily_vol_normalised_returns"
      - "rawdata.normalised_price_for_asset_class"
    other_args:
      horizon: 20
  relmomentum40:
    function: systems.provided.rules.rel_mom.relative_momentum
    data:
      - "rawdata.get_cumulative_daily_vol_normalised_returns"
      - "rawdata.normalised_price_for_asset_class"
    other_args:
      horizon: 40
  relmomentum80:
    function: systems.provided.rules.rel_mom.relative_momentum
    data:
      - "rawdata.get_cumulative_daily_vol_normalised_returns"
      - "rawdata.normalised_price_for_asset_class"
    other_args:
      horizon: 80

# === FORECAST SCALARS ===
# From Rob Carver's calibrated values
forecast_scalars:
  momentum4: 8.54
  momentum8: 5.95
  momentum16: 4.10
  momentum32: 2.79
  momentum64: 1.91
  carry30: 28.38
  carry60: 28.40
  carry125: 29.37
  relmomentum20: 86.51
  relmomentum40: 117.78
  relmomentum80: 159.88

# === FORECAST COMBINATION ===
# Equal-weighted within each factor, then 1/3 each factor group
#   Trend (5 rules × 1/3 ÷ 5 = 0.067 each)
#   Carry  (3 rules × 1/3 ÷ 3 = 0.111 each)
#   CS Mom (3 rules × 1/3 ÷ 3 = 0.111 each)
forecast_cap: 20.0
forecast_weights:
  momentum4: 0.067
  momentum8: 0.067
  momentum16: 0.067
  momentum32: 0.067
  momentum64: 0.067
  carry30: 0.111
  carry60: 0.111
  carry125: 0.111
  relmomentum20: 0.111
  relmomentum40: 0.111
  relmomentum80: 0.111
# Note: weights sum to 1.001 (~1.0)

forecast_div_multiplier: 1.35

# === POSITION SIZING ===
percentage_vol_target: 25.0
notional_trading_capital: 200000
base_currency: "USD"

# === ESTIMATION (enable for data-driven weights/scalars) ===
# Uncomment to let the system estimate instead of using fixed values:
# use_forecast_scale_estimates: True
# use_forecast_weight_estimates: True
# use_forecast_div_mult_estimates: True
# use_instrument_weight_estimates: True
# use_instrument_div_mult_estimates: True
