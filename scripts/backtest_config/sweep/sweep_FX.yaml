instruments:
- AUD_micro
- BUND
- DAX
- FTSE100
- FTSECHINAA
- GILT
- IBEX_mini
- JGB
- MXP
- NASDAQ_micro
- NIKKEI
- SP500_micro
- US10
- US5
- YENEUR
trading_rules:
  momentum4:
    function: systems.provided.rules.ewmac.ewmac
    data:
    - rawdata.get_daily_prices
    - rawdata.daily_returns_volatility
    other_args:
      Lfast: 4
      Lslow: 16
  momentum8:
    function: systems.provided.rules.ewmac.ewmac
    data:
    - rawdata.get_daily_prices
    - rawdata.daily_returns_volatility
    other_args:
      Lfast: 8
      Lslow: 32
  momentum16:
    function: systems.provided.rules.ewmac.ewmac
    data:
    - rawdata.get_daily_prices
    - rawdata.daily_returns_volatility
    other_args:
      Lfast: 16
      Lslow: 64
  momentum32:
    function: systems.provided.rules.ewmac.ewmac
    data:
    - rawdata.get_daily_prices
    - rawdata.daily_returns_volatility
    other_args:
      Lfast: 32
      Lslow: 128
  momentum64:
    function: systems.provided.rules.ewmac.ewmac
    data:
    - rawdata.get_daily_prices
    - rawdata.daily_returns_volatility
    other_args:
      Lfast: 64
      Lslow: 256
  carry30:
    function: systems.provided.rules.carry.carry
    data:
    - rawdata.raw_carry
    other_args:
      smooth_days: 30
  carry60:
    function: systems.provided.rules.carry.carry
    data:
    - rawdata.raw_carry
    other_args:
      smooth_days: 60
  carry125:
    function: systems.provided.rules.carry.carry
    data:
    - rawdata.raw_carry
    other_args:
      smooth_days: 125
  relmomentum20:
    function: systems.provided.rules.rel_mom.relative_momentum
    data:
    - rawdata.get_cumulative_daily_vol_normalised_returns
    - rawdata.normalised_price_for_asset_class
    other_args:
      horizon: 20
  relmomentum40:
    function: systems.provided.rules.rel_mom.relative_momentum
    data:
    - rawdata.get_cumulative_daily_vol_normalised_returns
    - rawdata.normalised_price_for_asset_class
    other_args:
      horizon: 40
  relmomentum80:
    function: systems.provided.rules.rel_mom.relative_momentum
    data:
    - rawdata.get_cumulative_daily_vol_normalised_returns
    - rawdata.normalised_price_for_asset_class
    other_args:
      horizon: 80
