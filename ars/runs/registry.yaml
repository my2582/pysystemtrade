  - id: 20260528T181556Z_carry_toggle
    label: carry_toggle
    timestamp: '2026-05-28T18:15:56Z'
    hypothesis_ref: ars/evidence_packs/carry_toggle/carry_toggle_preregistration.md
    status: refuted
    config:
      capital_usd: 50000
      vol_target_pct: 20.0
      instruments: [US10, SP500]
      forecast_weights:
        ewmac2_8: 0.117
        ewmac4_16: 0.117
        ewmac8_32: 0.117
        ewmac16_64: 0.117
        ewmac32_128: 0.117
        ewmac64_256: 0.117
        carry: 0.30
      runner: scripts/momentum_variants_backtest.py
    results:
      US10:
        baseline: {sharpe_gross: 0.347, skew_per_trade: 5.345}
        carry_on: {sharpe_gross: 0.437, skew_per_trade: 7.343, max_drawdown_pct_geom: -55.940}
        sharpe_shift: 0.090
        skew_reduction: -1.998  # NEGATIVE = carry INCREASED skew, opposite to pre-reg hypothesis
      SP500:
        baseline: {sharpe_gross: -0.009}
        carry_on: {sharpe_gross: 0.011}
    gates:
      G1_sharpe_shift: {observed: 0.090, threshold: ">= 0.03", verdict: PASS}
      G2_skew_reduction: {observed: -1.998, threshold: ">= 0.5", verdict: FAIL}
      G3_skew_above_floor: {observed: 7.343, threshold: ">= 1.0", verdict: PASS}
      G4_sp500_control: {observed: 0.011, threshold: "< 0.20", verdict: PASS}
    verdict_summary: |
      REFUTED. Adding carry to the trend stack DOES materially affect Sharpe
      (+0.090) but DOES NOT reduce per-trade skew on US10 -- it INCREASES
      skew_per_trade from 5.35 to 7.34. Pre-registered hypothesis (Martin
      §2.3 implication: carry as non-trend should flatten skew) is REFUTED
      on this instrument. Interpretation: bond futures carry (roll yield
      in backwardation under secular rate decline) is itself a positively-
      skewed return source on this contract; combining it with trend
      compounds rather than dilutes the long-option signature. Single-
      instrument finding; does not generalise to cross-sectional or to
      contango-dominated commodities. SP500 carry_on Sharpe 0.011 confirms
      no false rescue on equity.
    path: ars/runs/20260528T181556Z_carry_toggle
    evidence_pack: ars/evidence_packs/carry_toggle
    decision_log: ars/DECISIONS.md#2026-05-29-carry-toggle-refuted

