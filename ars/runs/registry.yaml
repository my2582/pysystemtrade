      proportional to forecast/10), which keeps realized vol close to target.
      Thus the single-decision rule is COMPROMISED: this run varies TWO things vs
      baseline (universe choice AND sizing rule), not one. Sharpe-lift is real
      direction-of-edge evidence (PASS at higher realized vol), but the unequal
      vol levels make the maxDD comparison structurally unfavorable.
