      run_id: 20260528T161350Z_martin_single_instrument
      US10:
        sharpe_gross: 0.396
        max_drawdown_pct_geom: -55.347
        ann_vol_pct: 22.431
        skew_per_trade: 4.382
        ann_subsystem_turnover: 34.41
    gates:
      G1_sharpe_lift: {observed: +0.073, threshold: ">= +0.05", verdict: PASS}
      G2_maxDD_lift_pp: {observed: -25.69, threshold: ">= +5.0 pp", verdict: FAIL}
      G3_turnover: {observed: 38.70, threshold: "<= 68.82", verdict: PASS}
      G4_skew_per_trade: {observed: 7.17, threshold: ">= 1.0", verdict: PASS}
      G_recon: {observed: 1.67, threshold: "< 5.0", verdict: PASS}
    verdict_summary: |
      FALSIFIED by exclusion: G1 PASS (Sharpe lift +0.073 above gate) but G2 FAIL
      (rotation MaxDD -81% vs baseline -55%, i.e. 26pp WORSE). Outcome does not fit
      pre-reg Path A (requires G1+G2 both PASS) nor Path B (regime-conditional —
      requires G2 PASS with G1 allowed to fail). The dual G1-PASS / G2-FAIL bucket
      was not anticipated in §4 and is treated as falsified-with-finding under
      the spirit of single-decision attribution.
    finding: |
      Root cause is OVER-SIZING. Realized ann vol is 52.5% vs target 20.0%
      (2.6x overshoot). The pre-registered sizing rule ("fixed-vol-target integer
      contracts") does not scale by forecast magnitude, but top-1 selection
      biases the held forecast toward the 15-20 range (we pick the strongest signal).
      Martin baseline uses pysystemtrade-native forecast-scaled sizing (position
      proportional to forecast/10), which keeps realized vol close to target.
      Thus the single-decision rule is COMPROMISED: this run varies TWO things vs
      baseline (universe choice AND sizing rule), not one. Sharpe-lift is real
      direction-of-edge evidence (PASS at higher realized vol), but the unequal
      vol levels make the maxDD comparison structurally unfavorable.
      Next experiment: re-pre-register top1rot_pit50k with sizing rule changed
      to pysystemtrade-native forecast-scaled (matching baseline). Until then,
      universe-choice attribution remains uncleanly identified.
